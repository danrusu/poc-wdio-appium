name: Android Test

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - master
  pull_request:

jobs:
  android-test:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm ci

      - name: Run Android emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: arm64-v8a
          profile: pixel_7
          target: google_apis
          emulator-boot-timeout: 900

          disable-animations: true
          force-avd-creation: true
          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
            adb devices
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics -no-snapshot
          script: |
            adb devices
            adb wait-for-device

            sleep 30

            adb shell getprop sys.boot_completed
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            echo "TEST_USER_1_USERNAME=${{ secrets.TEST_USER_1_USERNAME }}" >> .env
            echo "TEST_USER_1_PASSWORD=${{ secrets.TEST_USER_1_PASSWORD }}" >> .env

            npm run test:demo

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            logs
          if-no-files-found: ignore
